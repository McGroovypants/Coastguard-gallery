<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
<title>Coastguard 2026 Photo Gallery</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a1628; color: #fff; min-height: 100vh; }

/* LOGIN */
.login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0a1628 100%); padding: 20px; }
.login-logos { display: flex; align-items: center; gap: 30px; margin-bottom: 30px; }
.logo-bg { background: rgba(255,255,255,0.95); border-radius: 12px; padding: 12px 18px; display: flex; align-items: center; justify-content: center; }
.login-logos img { height: 70px; object-fit: contain; }
.login-divider { width: 2px; height: 50px; background: rgba(255,255,255,0.3); }
.login-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; text-align: center; }
.login-subtitle { font-size: 16px; color: rgba(255,255,255,0.6); margin-bottom: 30px; text-align: center; }
.login-box { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 30px; width: 100%; max-width: 380px; }
.login-box label { display: block; font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 6px; }
.login-box input { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: #fff; font-size: 15px; outline: none; }
.login-box input:focus { border-color: #e63329; }
.login-box button { width: 100%; padding: 12px; margin-top: 16px; border-radius: 8px; border: none; background: #e63329; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.login-box button:hover { background: #c42a22; }
.login-error { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }

/* HEADER */
.header { background: rgba(10,22,40,0.95); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
.header-logos { display: flex; align-items: center; gap: 16px; }
.header-logo-bg { background: rgba(255,255,255,0.95); border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; justify-content: center; }
.header-logos img { height: 40px; object-fit: contain; }
.header-divider { width: 1px; height: 30px; background: rgba(255,255,255,0.2); }
.header-title { font-size: 18px; font-weight: 600; }
.credit { font-size: 12px; color: rgba(255,255,255,0.5); }

/* CATEGORIES */
.container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
.section-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 40px; }
.cat-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; text-align: center; cursor: pointer; transition: all 0.2s; }
.cat-card:hover { background: rgba(255,255,255,0.1); border-color: #e63329; transform: translateY(-2px); }
.cat-card.active { border-color: #e63329; background: rgba(230,51,41,0.1); }
.cat-thumb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; aspect-ratio: 16/10; overflow: hidden; }
.cat-thumb-grid img { width: 100%; height: 100%; object-fit: cover; }
.cat-card-team .cat-thumb-grid img { object-position: top; }
.cat-label { font-size: 16px; font-weight: 600; padding: 12px 12px 4px; }
.cat-count { font-size: 13px; color: rgba(255,255,255,0.5); padding: 0 12px 16px; }

/* GALLERY BAR */
.gallery-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.gallery-bar h2 { font-size: 20px; font-weight: 600; }
.back-btn, .download-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; font-size: 13px; cursor: pointer; text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
.back-btn:hover { background: rgba(255,255,255,0.1); }
.download-btn { background: #e63329; border-color: #e63329; }
.download-btn:hover { background: #c42a22; }
.download-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* PHOTO GRID */
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.photo-thumb { aspect-ratio: 4/3; border-radius: 8px; overflow: hidden; cursor: pointer; position: relative; background: rgba(255,255,255,0.05); }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
.photo-grid.team-shots .photo-thumb { aspect-ratio: 3/4; }
.photo-grid.team-shots .photo-thumb img { object-position: top; }
.photo-thumb:hover img { transform: scale(1.05); }

/* LIGHTBOX */
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; align-items: center; justify-content: center; flex-direction: column; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 90vw; max-height: 80vh; object-fit: contain; border-radius: 4px; }
.lightbox-close { position: absolute; top: 16px; right: 20px; font-size: 28px; color: #fff; cursor: pointer; background: none; border: none; z-index: 1001; }
.lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 32px; color: #fff; cursor: pointer; background: rgba(0,0,0,0.5); border: none; padding: 12px 16px; border-radius: 8px; z-index: 1001; }
.lightbox-nav.prev { left: 16px; }
.lightbox-nav.next { right: 16px; }
.lightbox-info { position: absolute; bottom: 20px; text-align: center; color: rgba(255,255,255,0.7); font-size: 14px; }
.lightbox-download { display: inline-block; margin-top: 8px; padding: 6px 14px; background: #e63329; color: #fff; text-decoration: none; border-radius: 6px; font-size: 13px; }
.lightbox-download:hover { background: #c42a22; }

/* ZIP PROGRESS */
.zip-progress { display: none; align-items: center; gap: 10px; margin-left: 8px; }
.zip-progress.active { display: inline-flex; }
.zip-bar { width: 120px; height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; }
.zip-bar-fill { height: 100%; background: #e63329; border-radius: 4px; transition: width 0.2s; width: 0%; }
.zip-text { font-size: 12px; color: rgba(255,255,255,0.6); }

.hidden { display: none !important; }

@media (max-width: 600px) {
  .login-logos { flex-direction: column; gap: 10px; }
  .login-divider { width: 50px; height: 2px; }
  .login-logos img { height: 44px; }
  .logo-bg { padding: 8px 14px; }
  .login-title { font-size: 22px; }
  .login-box { padding: 24px 20px; }
  .login-box input { padding: 10px; font-size: 16px; }
  .header { flex-direction: column; gap: 6px; padding: 8px 12px; }
  .header-logos { flex-direction: row; gap: 8px; }
  .header-divider { display: none; }
  .header-logos img { height: 24px; }
  .header-logo-bg { padding: 3px 6px; border-radius: 6px; }
  .header-right { text-align: center; }
  .header-title { font-size: 13px; }
  .header-credit { font-size: 10px; }
  .cat-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .photo-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .lightbox-close { top: 12px; right: 12px; font-size: 36px; padding: 8px; background: rgba(0,0,0,0.6); border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
  .lightbox-nav { padding: 8px 12px; font-size: 28px; }
  .lightbox-nav.prev { left: 8px; }
  .lightbox-nav.next { right: 8px; }
  .lightbox img { max-width: 95vw; max-height: 70vh; }
  .lightbox-info { bottom: 12px; font-size: 12px; left: 10px; right: 10px; }
}

/* VIDEO CATEGORY & GRID */
.video-thumb { aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; cursor: pointer; position: relative; background: rgba(255,255,255,0.05); }
.video-thumb.square { aspect-ratio: 1/1; }
.video-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
.video-thumb:hover img { transform: scale(1.05); }
.video-play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: rgba(0,0,0,0.7); border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.video-play-icon::after { content: ''; display: block; width: 0; height: 0; border-style: solid; border-width: 12px 0 12px 22px; border-color: transparent transparent transparent #fff; margin-left: 4px; }
.video-duration { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
.video-card-wrapper { display: flex; flex-direction: column; }
.video-title { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 6px; text-align: center; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cat-card-videos .cat-thumb-grid { position: relative; }
.cat-card-videos .cat-thumb-grid::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background: rgba(0,0,0,0.6); border-radius: 50%; }
.cat-card-videos .cat-thumb-grid::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 0; height: 0; border-style: solid; border-width: 10px 0 10px 18px; border-color: transparent transparent transparent #fff; margin-left: 3px; z-index: 2; }

/* VIDEO PLAYER MODAL */
.video-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; align-items: center; justify-content: center; flex-direction: column; }
.video-modal.open { display: flex; }
.video-modal-close { position: absolute; top: 16px; right: 20px; font-size: 28px; color: #fff; cursor: pointer; background: none; border: none; z-index: 1001; }
.video-modal-content { width: 90vw; max-width: 1400px; aspect-ratio: 16/9; }
.video-modal-content.square { aspect-ratio: 1/1; max-width: 80vh; }
#videoPlayerContainer { width: 100%; height: 100%; }
.video-modal-content iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
.video-modal-title { color: rgba(255,255,255,0.8); font-size: 16px; margin-top: 16px; text-align: center; }

@media (max-width: 600px) {
  .video-play-icon { width: 44px; height: 44px; }
  .video-play-icon::after { border-width: 8px 0 8px 16px; margin-left: 3px; }
  .video-modal-close { top: 12px; right: 12px; font-size: 36px; padding: 8px; background: rgba(0,0,0,0.6); border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
  .video-modal-content { width: 95vw; }
}


.video-download-btn {
  position: absolute;
  bottom: 40px;
  right: 8px;
  background: rgba(0,0,0,0.7);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  cursor: pointer;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: background 0.2s;
}
.video-download-btn:hover {
  background: rgba(0,100,200,0.9);
}
.video-download-btn svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

</style>
</head>

// SHA-256 hash function
async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function tryLogin() {
  const input = document.getElementById('accessCode').value.trim();
  const hash = await sha256(input);
  if (hash === CODE_HASH) {
    // Code is correct - offer to save with biometrics if available and not yet registered
    if (isWebAuthnAvailable() && !getStoredCredential()) {
      const wantBiometric = confirm('Access granted! Would you like to save this with Face ID / Touch ID for next time?');
      if (wantBiometric) {
        await registerBiometric();
        return; // registerBiometric handles the login redirect on success
      }
    }
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainGallery').classList.remove('hidden');
    renderCategories();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

  if (e.key === 'Enter') tryLogin();

// Download entire folder as ZIP
async function downloadFolder() {
  if (!currentCategory) return;
  const photos = photoData[currentCategory.key];
  const btn = document.getElementById('folderDownloadBtn');
  const progress = document.getElementById('zipProgress');
  const barFill = document.getElementById('zipBarFill');
  const zipText = document.getElementById('zipText');

  btn.disabled = true;
  btn.innerHTML = '&#8987; Preparing ZIP...';
  progress.classList.add('active');

  try {
    const zip = new JSZip();
    let completed = 0;

    // Fetch all images in parallel (batches of 6 to avoid overwhelming)
    const batchSize = 6;
    for (let i = 0; i < photos.length; i += batchSize) {
      const batch = photos.slice(i, i + batchSize);
      const promises = batch.map(async (photo) => {
        const response = await fetch(photo.url);
        const blob = await response.blob();
        zip.file(photo.name, blob);
        completed++;
        const pct = Math.round((completed / photos.length) * 100);
        barFill.style.width = pct + '%';
        zipText.textContent = pct + '%';
      });
      await Promise.all(promises);
    }

    zipText.textContent = 'Zipping...';
    const content = await zip.generateAsync({ type: 'blob' });
    const folderName = currentCategory.label.replace(/[^a-zA-Z0-9 -]/g, '').trim();
    saveAs(content, folderName + '.zip');

    btn.innerHTML = '&#10003; Download Complete';
    zipText.textContent = 'Done!';
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = '&#8595; Download All Photos';
      progress.classList.remove('active');
    }, 3000);
  } catch (err) {
    console.error('ZIP download failed:', err);
    btn.disabled = false;
    btn.innerHTML = '&#8595; Download All Photos';
    progress.classList.remove('active');
    alert('Download failed. Please try again.');
  }
}

async function downloadFolderVideos(videos, folderName) {
  if (!videos || videos.length === 0) return;
  
  // Estimate total size - we'll check after getting download info
  var MAX_ZIP_SIZE = 5 * 1024 * 1024 * 1024; // 5GB
  
  // Show progress
  var progressHtml = '<div id="downloadProgress" style="position:fixed;top:0;left:0;right:0;z-index:10000;' +
    'background:rgba(0,14,45,0.95);padding:20px;text-align:center;color:#fff;">' +
    '<div style="font-size:16px;margin-bottom:10px;" id="downloadStatusText">Preparing downloads...</div>' +
    '<div style="background:rgba(255,255,255,0.2);border-radius:10px;height:20px;overflow:hidden;max-width:500px;margin:0 auto;">' +
    '<div id="downloadBarFill" style="background:linear-gradient(90deg,#f04123,#ff6b4a);height:100%;width:0%;transition:width 0.3s;border-radius:10px;"></div>' +
    '</div>' +
    '<div style="margin-top:10px;font-size:13px;color:rgba(255,255,255,0.6);" id="downloadDetail"></div>' +
    '<button onclick="document.getElementById(\'downloadProgress\').remove();" style="margin-top:12px;padding:6px 20px;background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:6px;cursor:pointer;">Cancel</button>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', progressHtml);
  
  var statusText = document.getElementById('downloadStatusText');
  var barFill = document.getElementById('downloadBarFill');
  var detailEl = document.getElementById('downloadDetail');
  
  try {
    // First, get download URLs for all videos
    statusText.textContent = 'Getting download links...';
    var downloadInfos = [];
    
    for (var i = 0; i < videos.length; i++) {
      var response = await fetch('/.netlify/functions/vimeo-download?id=' + videos[i].id + '&format=json');
      if (response.ok) {
        var info = await response.json();
        downloadInfos.push(info);
      }
      barFill.style.width = Math.round(((i + 1) / videos.length) * 20) + '%';
    }
    
    // Check total size
    var totalSize = downloadInfos.reduce(function(sum, d) { return sum + (d.size || 0); }, 0);
    
    if (totalSize > MAX_ZIP_SIZE) {
      // Too large for ZIP - fall back to individual downloads
      statusText.textContent = 'Files too large for ZIP (' + (totalSize / (1024*1024*1024)).toFixed(1) + 'GB). Starting individual downloads...';
      
      for (var j = 0; j < downloadInfos.length; j++) {
        window.open(downloadInfos[j].url, '_blank');
        await new Promise(function(r) { setTimeout(r, 1500); }); // Stagger downloads
      }
      
      setTimeout(function() {
        var prog = document.getElementById('downloadProgress');
        if (prog) prog.remove();
      }, 3000);
      return;
    }
    
    // Build ZIP using JSZip
    statusText.textContent = 'Downloading and packaging videos...';
    barFill.style.width = '20%';
    
    var zip = new JSZip();
    var completed = 0;
    var BATCH_SIZE = 2; // Concurrency limit per Andy\'s review
    
    for (var k = 0; k < downloadInfos.length; k += BATCH_SIZE) {
      var batch = downloadInfos.slice(k, k + BATCH_SIZE);
      var promises = batch.map(function(info) {
        return fetch(info.url)
          .then(function(r) { return r.blob(); })
          .then(function(blob) {
            var fileName = info.name.replace(/[/\\?%*:|"<>]/g, '-') + '.mp4';
            zip.file(fileName, blob);
            completed++;
            var pct = 20 + Math.round((completed / downloadInfos.length) * 60);
            barFill.style.width = pct + '%';
            detailEl.textContent = completed + ' of ' + downloadInfos.length + ' videos downloaded';
          });
      });
      await Promise.all(promises);
    }
    
    // Generate ZIP
    statusText.textContent = 'Creating ZIP file...';
    barFill.style.width = '85%';
    
    var zipBlob = await zip.generateAsync({type: 'blob'}, function(metadata) {
      var pct = 85 + Math.round(metadata.percent * 0.15);
      barFill.style.width = pct + '%';
    });
    
    // Save ZIP
    var zipName = (folderName || 'Coastguard-Videos').replace(/[/\\?%*:|"<>]/g, '-') + '.zip';
    saveAs(zipBlob, zipName);
    
    statusText.textContent = 'Download complete!';
    barFill.style.width = '100%';
    
    setTimeout(function() {
      var prog = document.getElementById('downloadProgress');
      if (prog) prog.remove();
    }, 3000);
    
  } catch (error) {
    statusText.textContent = 'Download failed: ' + error.message;
    detailEl.textContent = 'Your browser may not support bulk ZIP download. Try individual downloads instead.';
    
    setTimeout(function() {
      var prog = document.getElementById('downloadProgress');
      if (prog) prog.remove();
    }, 5000);
  }
}

// === WebAuthn Biometric Bypass ===
const WEBAUTHN_STORAGE_KEY = 'gallery_webauthn_credential';

function isWebAuthnAvailable() {
  return window.PublicKeyCredential !== undefined && 
         typeof window.PublicKeyCredential === 'function';
}

function getStoredCredential() {
  const stored = localStorage.getItem(WEBAUTHN_STORAGE_KEY);
  if (stored) {
    try { return JSON.parse(stored); } catch(e) { return null; }
  }
  return null;
}

function storeCredential(credentialId) {
  localStorage.setItem(WEBAUTHN_STORAGE_KEY, JSON.stringify({
    id: credentialId,
    created: Date.now()
  }));
}

// Convert base64url to ArrayBuffer
function base64urlToBuffer(base64url) {
  const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
  const pad = base64.length % 4;
  const padded = pad ? base64 + '='.repeat(4 - pad) : base64;
  const binary = atob(padded);
  const buffer = new ArrayBuffer(binary.length);
  const view = new Uint8Array(buffer);
  for (let i = 0; i < binary.length; i++) {
    view[i] = binary.charCodeAt(i);
  }
  return buffer;
}

// Convert ArrayBuffer to base64url
function bufferToBase64url(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

// Generate random challenge
function generateChallenge() {
  const arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  return arr.buffer;
}

async function registerBiometric() {
  const statusEl = document.getElementById('biometricStatus');
  
  // Require access code before allowing passkey registration
  const codeInput = document.getElementById('accessCode');
  const enteredCode = (codeInput ? codeInput.value : '').trim();
  if (!enteredCode) {
    statusEl.textContent = 'Enter the access code first, then tap here to save it';
    setTimeout(() => { statusEl.textContent = ''; }, 4000);
    return;
  }
  
  // Validate the access code (same SHA-256 check as tryLogin)
  const encoder = new TextEncoder();
  const data = encoder.encode(enteredCode.toUpperCase());
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  
  if (hashHex !== CODE_HASH) {
    statusEl.textContent = 'Incorrect code — enter the right access code first';
    setTimeout(() => { statusEl.textContent = ''; }, 4000);
    return;
  }
  
  statusEl.textContent = 'Setting up biometric...';
  
  try {
    const challenge = generateChallenge();
    
    const createOptions = {
      publicKey: {
        rp: {
          name: "Coastguard Gallery",
          id: window.location.hostname
        },
        user: {
          id: new Uint8Array([1, 2, 3, 4]),
          name: "gallery-admin",
          displayName: "Gallery Admin"
        },
        challenge: challenge,
        pubKeyCredParams: [
          { type: "public-key", alg: -7 },   // ES256
          { type: "public-key", alg: -257 }  // RS256
        ],
        authenticatorSelection: {
          authenticatorAttachment: "platform",
          userVerification: "required",
          residentKey: "preferred"
        },
        timeout: 60000,
        attestation: "none"
      }
    };
    
    const credential = await navigator.credentials.create(createOptions);
    const credentialId = bufferToBase64url(credential.rawId);
    storeCredential(credentialId);
    
    statusEl.textContent = 'Biometric registered! Logging in...';
    
    // Successful registration = successful auth, go to gallery
    setTimeout(() => {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainGallery').classList.remove('hidden');
      renderCategories();
    }, 500);
    
  } catch (err) {
    console.error('WebAuthn registration error:', err);
    statusEl.textContent = 'Setup cancelled or not supported';
    setTimeout(() => { statusEl.textContent = ''; }, 3000);
  }
}

async function authenticateBiometric() {
  const statusEl = document.getElementById('biometricStatus');
  statusEl.textContent = 'Verifying...';
  
  const stored = getStoredCredential();
  if (!stored) {
    statusEl.textContent = 'No biometric registered';
    return false;
  }
  
  try {
    const challenge = generateChallenge();
    
    const getOptions = {
      publicKey: {
        challenge: challenge,
        allowCredentials: [{
          type: "public-key",
          id: base64urlToBuffer(stored.id),
          transports: ["internal"]
        }],
        userVerification: "required",
        timeout: 60000
      }
    };
    
    const assertion = await navigator.credentials.get(getOptions);
    
    statusEl.textContent = 'Verified! Logging in...';
    
    setTimeout(() => {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainGallery').classList.remove('hidden');
      renderCategories();
    }, 500);
    
    return true;
    
  } catch (err) {
    console.error('WebAuthn auth error:', err);
    statusEl.textContent = 'Verification cancelled';
    setTimeout(() => { statusEl.textContent = ''; }, 3000);
    return false;
  }
}

async function handleBiometric() {
  if (!isWebAuthnAvailable()) {
    document.getElementById('biometricStatus').textContent = 'Biometrics not supported on this device';
    return;
  }
  
  const stored = getStoredCredential();
  if (stored) {
    // Already registered - authenticate
    await authenticateBiometric();
  } else {
    // First time - register
    await registerBiometric();
  }
}

// On page load, check if biometric is available and update button visibility
document.addEventListener('DOMContentLoaded', function() {
  if (!isWebAuthnAvailable()) {
    const biometricSection = document.getElementById('biometricSection');
    if (biometricSection) biometricSection.style.display = 'none';
  }
});
